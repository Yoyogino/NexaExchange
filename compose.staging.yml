services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      RUN_MIGRATIONS: 0
      PORT: 3001
      TRUST_PROXY: 1
      DATABASE_URL: postgresql://nexa_app:${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}@postgres:5432/exchange
      REDIS_URL: redis://redis:6379
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Set DATA_ENCRYPTION_KEY}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-generic}
      EMAIL_API_URL: ${EMAIL_API_URL:-}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:?Set EMAIL_FROM}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      MONITORING_TOKEN: ${MONITORING_TOKEN:?Set MONITORING_TOKEN}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  migrate:
    build: .
    restart: "no"
    command: ["node", "server/migrate.mjs"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://nexa_migrator:${POSTGRES_MIGRATION_PASSWORD:?Set POSTGRES_MIGRATION_PASSWORD}@postgres:5432/exchange
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Set DATA_ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy

  backup:
    profiles: ["operations"]
    build: .
    restart: "no"
    command: ["node", "scripts/backup-staging.mjs"]
    environment:
      DATABASE_URL: postgresql://nexa_migrator:${POSTGRES_MIGRATION_PASSWORD:?Set POSTGRES_MIGRATION_PASSWORD}@postgres:5432/exchange
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?Set BACKUP_ENCRYPTION_KEY}
      BACKUP_OUTPUT_DIRECTORY: /backups
      OFFSITE_BACKUP_DIRECTORY: /offsite
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ${OFFSITE_BACKUP_DIRECTORY:?Set OFFSITE_BACKUP_DIRECTORY}:/offsite
    depends_on:
      postgres:
        condition: service_healthy

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      STAGING_DOMAIN: ${STAGING_DOMAIN:?Set STAGING_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://app:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: exchange
      POSTGRES_USER: exchange_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}
      POSTGRES_MIGRATION_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?Set POSTGRES_MIGRATION_PASSWORD}
    volumes:
      - staging_postgres:/var/lib/postgresql/data
      - ./deploy/postgres/01-app-role.sh:/docker-entrypoint-initdb.d/01-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exchange_owner -d exchange"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - staging_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  staging_postgres:
  staging_redis:
  caddy_data:
