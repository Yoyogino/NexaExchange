name: Verify demo exchange

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: exchange_demo
          POSTGRES_USER: exchange
          POSTGRES_PASSWORD: exchange_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U exchange -d exchange_demo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://exchange:exchange_dev_password@localhost:5432/exchange_demo
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Type check
        run: npm run typecheck
      - name: Build web application
        run: npm run build
      - name: Run test suite
        run: npm run test
      - name: Validate staging configuration
        run: docker compose --env-file .env.staging.example -f compose.staging.yml config --quiet
      - name: Build production container
        run: docker build --tag nexa-exchange:${{ github.sha }} .
      - name: Scan production container
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: nexa-exchange:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
