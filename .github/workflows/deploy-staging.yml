name: Deploy simulated exchange to staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-deployment
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: exchange_demo
          POSTGRES_USER: exchange
          POSTGRES_PASSWORD: exchange_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U exchange -d exchange_demo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://exchange:exchange_dev_password@localhost:5432/exchange_demo
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run build
      - name: Create CI test environment
        run: |
          cp .env.example .env
          echo "STAGING_DOMAIN=localhost" >> .env
          echo "POSTGRES_APP_PASSWORD=exchange_dev_password" >> .env
          echo "POSTGRES_MIGRATION_PASSWORD=exchange_dev_password" >> .env
          echo "DATA_ENCRYPTION_KEY=dPUHKCGXg2p4GMBhSGro1RiAWQrzyrlNWf6MiDBMME0=" >> .env
          echo "BACKUP_ENCRYPTION_KEY=aUg9eY9GhkzVsfyNmn0FK2v/EJ9jdsjUPWhQfzMKlc8=" >> .env
      - run: npm test
      - run: docker compose --env-file .env -f docker-compose.yml -f compose.staging.yml up -d

  deploy:
    needs: verify
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Load and validate protected host environment
        run: |
          test -f /home/ubuntu/.env.staging
          install -m 600 /home/ubuntu/.env.staging .env.staging
          node --env-file=.env.staging scripts/validate-staging-env.mjs
          sed 's/\$/$$/g' .env.staging > .env.compose
          chmod 600 .env.compose
      - name: Deploy and verify readiness
        run: |
          if ! id -nG | grep -qw docker; then
            echo "Runner user must belong to the docker group."
            exit 1
          fi

          postgres_volume="ubuntu_staging_postgres"
          if docker inspect ubuntu-postgres-1 >/dev/null 2>&1; then
            postgres_volume="$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/var/lib/postgresql/data"}}{{.Name}}{{end}}{{end}}' ubuntu-postgres-1)"
            if [ -z "$postgres_volume" ]; then
              echo "Unable to identify the existing PostgreSQL data volume."
              exit 1
            fi
          else
            docker volume create "$postgres_volume" >/dev/null
          fi
          printf '\nPOSTGRES_VOLUME_NAME=%s\n' "$postgres_volume" >> .env.compose

          legacy_backups=""
          for service in app postgres redis proxy; do
            container="ubuntu-${service}-1"
            if docker inspect "$container" >/dev/null 2>&1; then
              compose_project="$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project"}}' "$container")"
              if [ "$compose_project" != "ubuntu" ]; then
                backup="${container}-pre-workflow"
                docker rm -f "$backup" >/dev/null 2>&1 || true
                docker stop "$container" >/dev/null
                docker rename "$container" "$backup"
                legacy_backups="$legacy_backups $container"
              fi
            fi
          done

          if ! docker compose --project-name ubuntu --env-file .env.compose -f compose.staging.yml up -d --build --remove-orphans; then
            docker compose --project-name ubuntu --env-file .env.compose -f compose.staging.yml down >/dev/null 2>&1 || true
            for container in $legacy_backups; do
              backup="${container}-pre-workflow"
              docker rm -f "$container" >/dev/null 2>&1 || true
              docker rename "$backup" "$container"
              docker start "$container" >/dev/null
            done
            if docker inspect ubuntu-proxy-1 >/dev/null 2>&1; then
              docker restart ubuntu-proxy-1 >/dev/null
            fi
            exit 1
          fi
          docker compose --project-name ubuntu --env-file .env.compose -f compose.staging.yml exec -T app wget --header="X-Forwarded-Proto: https" --no-verbose --tries=10 --spider http://127.0.0.1:3000/api/ready
      - name: Run public staging validation and account smoke test
        run: npm run validate:staging
      - name: Remove temporary environment copies
        if: always()
        run: rm -f .env.staging .env.compose
