name: Deploy simulated exchange to staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-deployment
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: exchange_demo
          POSTGRES_USER: exchange
          POSTGRES_PASSWORD: exchange_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U exchange -d exchange_demo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://exchange:exchange_dev_password@localhost:5432/exchange_demo
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run build
      - name: Create CI test environment
        run: cp .env.example .env
      - run: npm test
      - run: docker compose --env-file .env.staging.example -f compose.staging.yml config --quiet

  deploy:
    needs: verify
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Load and validate protected host environment
        run: |
          test -f /home/ubuntu/.env.staging
          install -m 600 /home/ubuntu/.env.staging .env.staging
          node --env-file=.env.staging scripts/validate-staging-env.mjs
          sed 's/\$/$$/g' .env.staging > .env.compose
          chmod 600 .env.compose
      - name: Deploy and verify readiness
        run: |
          set -eu

          if ! id -nG | grep -qw docker; then
            echo "Runner user must belong to the docker group."
            exit 1
          fi

          postgres_volume="ubuntu_staging_postgres"
          if docker inspect ubuntu-postgres-1 >/dev/null 2>&1; then
            postgres_volume="$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/var/lib/postgresql/data"}}{{.Name}}{{end}}{{end}}' ubuntu-postgres-1)"
            if [ -z "$postgres_volume" ]; then
              echo "Unable to identify the existing PostgreSQL data volume."
              exit 1
            fi
          else
            docker volume create "$postgres_volume" >/dev/null
          fi
          printf '\nPOSTGRES_VOLUME_NAME=%s\n' "$postgres_volume" >> .env.compose

          legacy_backups=""
          for service in app postgres redis proxy; do
            container="ubuntu-${service}-1"
            if docker inspect "$container" >/dev/null 2>&1; then
              compose_project="$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project"}}' "$container")"
              if [ "$compose_project" != "ubuntu" ]; then
                backup="${container}-pre-workflow"
                docker rm -f "$backup" >/dev/null 2>&1 || true
                docker stop "$container" >/dev/null
                docker rename "$container" "$backup"
                legacy_backups="$legacy_backups $container"
              fi
            fi
          done

          restore_legacy_containers() {
            for container in $legacy_backups; do
              backup="${container}-pre-workflow"
              docker rm -f "$container" >/dev/null 2>&1 || true
              docker rename "$backup" "$container"
              docker start "$container" >/dev/null
            done
            if docker inspect ubuntu-proxy-1 >/dev/null 2>&1; then
              docker restart ubuntu-proxy-1 >/dev/null
            fi
          }

          previous_app_image=""
          previous_app_tag=""
          if docker inspect ubuntu-app-1 >/dev/null 2>&1; then
            previous_app_image="$(docker inspect --format '{{.Image}}' ubuntu-app-1)"
            previous_app_tag="$(docker inspect --format '{{.Config.Image}}' ubuntu-app-1)"
            if ! docker image inspect "$previous_app_image" >/dev/null 2>&1; then
              running_manifest="$(docker inspect --format '{{if .ImageManifestDescriptor}}{{.ImageManifestDescriptor.Digest}}{{end}}' ubuntu-app-1 2>/dev/null || true)"
              running_platform="$(docker inspect --format '{{if .ImageManifestDescriptor}}{{.ImageManifestDescriptor.Platform.OS}}/{{.ImageManifestDescriptor.Platform.Architecture}}{{end}}' ubuntu-app-1 2>/dev/null || true)"
              tagged_manifest=""
              if [ -n "$running_manifest" ] && [ -n "$running_platform" ]; then
                tagged_manifest="$(docker image inspect --platform "$running_platform" "$previous_app_tag" --format '{{.Id}}' 2>/dev/null || true)"
              fi
              if [ -n "$running_manifest" ] && [ "$tagged_manifest" = "$running_manifest" ]; then
                previous_app_image="$(docker image inspect "$previous_app_tag" --format '{{.Id}}')"
              else
                echo "Previous application image is unavailable; refusing deployment without a rollback image."
                restore_legacy_containers
                exit 1
              fi
            fi
          fi

          docker compose --project-name ubuntu --env-file .env.compose -f compose.staging.yml build app migrate
          docker compose --project-name ubuntu --env-file .env.compose -f compose.staging.yml up -d --no-deps postgres redis

          postgres_attempt=0
          until [ "$(docker inspect --format '{{.State.Health.Status}}' ubuntu-postgres-1 2>/dev/null || true)" = "healthy" ]; do
            postgres_attempt=$((postgres_attempt + 1))
            if [ "$postgres_attempt" -ge 30 ]; then
              docker compose --project-name ubuntu --env-file .env.compose -f compose.staging.yml logs --tail 100 postgres
              restore_legacy_containers
              exit 1
            fi
            sleep 2
          done

          node --env-file=.env.staging scripts/sync-staging-db-role-passwords.mjs

          if ! docker compose --project-name ubuntu --env-file .env.compose -f compose.staging.yml run --rm migrate; then
            docker compose --project-name ubuntu --env-file .env.compose -f compose.staging.yml logs --tail 150 postgres
            restore_legacy_containers
            exit 1
          fi

          docker compose --project-name ubuntu --env-file .env.compose -f compose.staging.yml up -d --no-deps app

          app_attempt=0
          until docker compose --project-name ubuntu --env-file .env.compose -f compose.staging.yml exec -T app wget --header="X-Forwarded-Proto: https" --no-verbose --tries=1 --spider http://127.0.0.1:3001/api/ready; do
            app_attempt=$((app_attempt + 1))
            if [ "$app_attempt" -ge 30 ]; then
              docker compose --project-name ubuntu --env-file .env.compose -f compose.staging.yml logs --tail 150 app
              if [ -n "$previous_app_image" ] && [ -n "$previous_app_tag" ]; then
                docker tag "$previous_app_image" "$previous_app_tag"
                docker compose --project-name ubuntu --env-file .env.compose -f compose.staging.yml up -d --no-deps --force-recreate app
              fi
              restore_legacy_containers
              # Verify recovery without reporting the failed deployment as successful.
              rollback_attempt=0
              until docker exec ubuntu-app-1 wget --timeout=5 --header="X-Forwarded-Proto: https" --no-verbose --tries=1 --spider http://127.0.0.1:3001/api/ready; do
                rollback_attempt=$((rollback_attempt + 1))
                if [ "$rollback_attempt" -ge 30 ]; then
                  echo "::error::Application recovery did not become ready; operator intervention required."
                  exit 1
                fi
                sleep 2
              done
              echo "Application recovery readiness confirmed; deployment remains failed."
              exit 1
            fi
            sleep 2
          done

          docker compose --project-name ubuntu --env-file .env.compose -f compose.staging.yml up -d --no-deps proxy
          docker compose --project-name ubuntu --env-file .env.compose -f compose.staging.yml ps
      - name: Run public staging validation and account smoke test
        run: npm run validate:staging
      - name: Remove temporary environment copies
        if: always()
        run: rm -f .env.staging .env.compose
