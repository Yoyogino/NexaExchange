name: Deploy simulated exchange to staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-deployment
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: exchange_demo
          POSTGRES_USER: exchange
          POSTGRES_PASSWORD: exchange_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U exchange -d exchange_demo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://exchange:exchange_dev_password@localhost:5432/exchange_demo
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: docker compose --env-file .env.staging.example -f compose.staging.yml config --quiet

  deploy:
    needs: verify
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Load and validate protected host environment
        run: |
          test -f /home/ubuntu/.env.staging
          install -m 600 /home/ubuntu/.env.staging .env.staging
          node --env-file=.env.staging scripts/validate-staging-env.mjs
          sed 's/\$/$$/g' .env.staging > .env.compose
          chmod 600 .env.compose
      - name: Deploy and verify readiness
        run: |
          if ! id -nG | grep -qw docker; then
            echo "Runner user must belong to the docker group."
            exit 1
          fi
          legacy_backup=""
          if docker inspect ubuntu-app-1 >/dev/null 2>&1; then
            compose_project="$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project"}}' ubuntu-app-1)"
            if [ "$compose_project" != "ubuntu" ]; then
              legacy_backup="ubuntu-app-1-pre-workflow"
              docker rm -f "$legacy_backup" >/dev/null 2>&1 || true
              docker stop ubuntu-app-1 >/dev/null
              docker rename ubuntu-app-1 "$legacy_backup"
            fi
          fi
          if ! docker compose --project-name ubuntu --env-file .env.compose -f compose.staging.yml up -d --build --remove-orphans; then
            docker rm -f ubuntu-app-1 >/dev/null 2>&1 || true
            if [ -n "$legacy_backup" ]; then
              docker rename "$legacy_backup" ubuntu-app-1
              docker start ubuntu-app-1 >/dev/null
              docker restart ubuntu-proxy-1 >/dev/null
            fi
            exit 1
          fi
          docker compose --project-name ubuntu --env-file .env.compose -f compose.staging.yml exec -T app wget --header="X-Forwarded-Proto: https" --no-verbose --tries=10 --retry-connrefused --spider http://127.0.0.1:3001/api/ready
      - name: Run public staging validation and account smoke test
        run: npm run validate:staging
      - name: Remove temporary environment copies
        if: always()
        run: rm -f .env.staging .env.compose
